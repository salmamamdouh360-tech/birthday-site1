<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيد ميلاد سعيد 🎉</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
    padding: 20px;
  }

  .card {
    background: #fff;
    border-radius: 24px;
    padding: 40px 30px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    animation: pop 0.5s ease;
  }

  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  h1 {
    color: #d6336c;
    margin-bottom: 10px;
    font-size: 28px;
  }

  p.sub {
    color: #666;
    margin-bottom: 25px;
  }

  input[type="number"] {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    border: 2px solid #ffb6c1;
    border-radius: 12px;
    text-align: center;
    outline: none;
    margin-bottom: 15px;
  }

  input[type="number"]:focus {
    border-color: #d6336c;
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    font-weight: bold;
    background: #d6336c;
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #ad1457;
  }

  .hidden { display: none; }

  .result {
    margin-top: 20px;
  }

  .success h2 {
    color: #2b8a3e;
    font-size: 24px;
    margin-bottom: 20px;
  }

  .boxes {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 15px;
  }

  .box {
    background: linear-gradient(135deg, #ffd6e8, #ffe8cc);
    border: 2px dashed #d6336c;
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    font-size: 22px;
    transition: 0.25s;
    user-select: none;
  }

  .box:hover {
    transform: translateY(-3px) scale(1.02);
  }

  .box.opened {
    cursor: default;
    opacity: 0.6;
  }

  .revealed {
    background: #fff3cd;
    border-radius: 14px;
    padding: 16px;
    font-size: 15px;
    font-weight: bold;
    color: #444;
    line-height: 1.5;
    animation: pop 0.35s ease;
  }

  .revealed.danger {
    background: #ffe3e3;
    color: #c92a2a;
  }

  .box.danger {
    background: linear-gradient(135deg, #ffe3e3, #ffc9c9);
    border-color: #e03131;
    font-size: 15px;
    font-weight: bold;
    color: #c92a2a;
    animation: shake 1.2s infinite;
  }

  .box.danger.opened {
    animation: none;
  }

  @keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-3deg); }
    75% { transform: rotate(3deg); }
  }

  .fail video {
    max-width: 220px;
    border-radius: 16px;
    margin: 15px 0;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }

  .fail h2 {
    color: #e03131;
  }

  .retry {
    margin-top: 15px;
    background: transparent;
    color: #d6336c;
    border: 2px solid #d6336c;
  }

  .retry:hover {
    background: #d6336c;
    color: #fff;
  }

  #confettiCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
  }

  .box {
    position: relative;
    overflow: visible;
  }

  .spark {
    position: absolute;
    font-size: 20px;
    pointer-events: none;
    animation: sparkFly 0.8s ease-out forwards;
    z-index: 5;
  }

  @keyframes sparkFly {
    0% {
      transform: translate(-50%, -50%) scale(0.5);
      opacity: 1;
    }
    100% {
      transform: translate(var(--tx), var(--ty)) scale(1.2);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div class="card">
  <div id="askScreen">
    <!-- <h1>🎂 عيد ميلاد سعيد 🎂</h1> -->
    <p class="sub">قولّي كام عمرك النهارده؟</p>
    <input type="number" id="ageInput" placeholder="اكتب عمرك هنا">
    <button onclick="checkAge()">تأكيد</button>
  </div>

  <div id="resultScreen" class="result hidden"></div>
</div>

<script>
  // ✏️ الأمنيات اللي هتظهر في الصناديق - غيّريها براحتك
  const wishes = [
    "ربنا يرزقك بعربية شاص 🫡",
    "ربنا يكرمك وتسافر السفرية اللي بتتمناها، هي كانت كندا بس معرفش بقت إيه دلوقتي 😂",
    "ربنا يرزقك من وسع بفلوس وصحة وتنقل العيلة كلها للمستوى اللي بتحلم بيه 🤲",
    "ربنا يوفقك وتشتغل في شركة محترمة وتكون بتاع Flutter أو حاجة أعلى ✨"
  ];

  // ⚠️ أمنية الصندوق الخطر
  const dangerWish = "ربنا يرزقك بالزوجة الصالحة 🫣 سوري بس مقدرتش مقولهاش 😂";

  // 🎊 مؤثر الكونفيتي
  function launchConfetti() {
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ['#d6336c', '#f783ac', '#ffd43b', '#69db7c', '#4dabf7', '#ff922b'];
    const pieces = [];
    for (let i = 0; i < 150; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * canvas.height,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        speedY: 2 + Math.random() * 3,
        speedX: -1.5 + Math.random() * 3,
        rotation: Math.random() * 360,
        rotationSpeed: -6 + Math.random() * 12
      });
    }

    let frame = 0;
    const maxFrames = 240;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;
        p.rotation += p.rotationSpeed;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });
      frame++;
      if (frame < maxFrames) {
        requestAnimationFrame(draw);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
    draw();
  }

  // ✨ مؤثر شرارات لما يتفتح صندوق
  function sparkBurst(targetEl) {
    const emojis = ['✨', '🎉', '💖', '⭐'];
    const rect = targetEl.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    for (let i = 0; i < 8; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      s.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = centerX + 'px';
      s.style.top = centerY + 'px';
      const angle = (Math.PI * 2 * i) / 8;
      const dist = 60 + Math.random() * 30;
      s.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
      s.style.setProperty('--ty', (Math.sin(angle) * dist) + 'px');
      s.style.position = 'fixed';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 800);
    }
  }

  function checkAge() {
    const input = document.getElementById('ageInput');
    const val = parseInt(input.value);
    const askScreen = document.getElementById('askScreen');
    const resultScreen = document.getElementById('resultScreen');

    if (isNaN(val)) {
      alert("اكتب رقم عمرك الأول 😉");
      return;
    }

    askScreen.classList.add('hidden');
    resultScreen.classList.remove('hidden');

    if (val === 23) {
      launchConfetti();
      resultScreen.innerHTML = `
        <div class="success">
          <h2>🎉 كل عام وانت بخير 🎉</h2>
          <p>ويارب تتحقق السنادي الأمنية اللي هتختارها أو تحققهم كلهم 👇</p>
          <div class="boxes" id="boxesContainer"></div>
        </div>
      `;
      const container = document.getElementById('boxesContainer');

      // نجهز كل الصناديق: ٤ عادية + واحد خطر، ونخلطهم مع بعض
      const allBoxes = wishes.map(w => ({ wish: w, danger: false }));
      allBoxes.push({ wish: dangerWish, danger: true });
      allBoxes.sort(() => Math.random() - 0.5);

      allBoxes.forEach(item => {
        const box = document.createElement('div');
        if (item.danger) {
          box.className = 'box danger';
          box.innerText = '⚠️ مفاجأة خطيرة احترس';
        } else {
          box.className = 'box';
          box.innerText = '🎁';
        }
        box.onclick = function () {
          sparkBurst(box);
          const revealed = document.createElement('div');
          revealed.className = item.danger ? 'revealed danger' : 'revealed';
          revealed.innerText = item.wish;
          box.replaceWith(revealed);
        };
        container.appendChild(box);
      });
    } else {
      resultScreen.innerHTML = `
        <div class="fail">
          <h2>😹 غلط يا نجم!</h2>
          <video src="cat.mp4" autoplay loop muted playsinline></video>
          <p>حاول تاني كده 😉</p>
          <button class="retry" onclick="location.reload()">أعيد المحاولة</button>
        </div>
      `;
    }
  }

  document.getElementById('ageInput').addEventListener('keyup', function(e){
    if (e.key === "Enter") checkAge();
  });
</script>

</body>
</html>
